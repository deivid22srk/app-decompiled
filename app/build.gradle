apply plugin: 'com.android.application'

android {
    namespace 'com.deivid22srk.store'
    compileSdk 23

    defaultConfig {
        applicationId 'com.deivid22srk.store'
        minSdkVersion 9
        targetSdkVersion 23
        versionCode 80620200
        versionName '6.2.02-open'
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    dexOptions {
        javaMaxHeapSize '4g'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    androidResources {
        // Mantém os IDs de recursos idênticos aos do APK original (0x7f...):
        // o bytecode original em app/libs/ tem constantes 0x7f inlineadas.
        additionalParameters += ['--stable-ids', file('public-ids.txt').absolutePath]
    }

    sourceSets {
        main {
            // Código Java decompilado (jadx) mantido no repo em src/main/java
            // apenas para leitura/referência — NÃO é compilado (saída jadx não
            // recompila como está: generics perdidos, accessors sintéticos).
            // O código EXECUTÁVEL vem do bytecode original preservado via
            // apktool -> smali -> dex -> jar (app/libs/), com exception
            // handlers (try/catch) restaurados.
            // A camada offline nova (launcher sem login + catálogo de jogos)
            // fica em src/main/java-offline e é o único Java compilado.
            // srcDirs substitutivo evita qualquer filtragem por include/exclude
            // (o AGP 7.4 não honra include no sourceSet java).
            java {
                srcDirs = ['src/main/java-offline']
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:multidex:1.0.3'
}
