name: Build APK (Gradle)

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/gradle.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: Install platform 23
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-23" > /dev/null
          ls $ANDROID_HOME/platforms/

      - name: Monta framework completo (robolectric + java.* do platform)
        run: |
          curl -sSL -o /tmp/android-all.jar "https://repo1.maven.org/maven2/org/robolectric/android-all/6.0.1_r3-robolectric-r1/android-all-6.0.1_r3-robolectric-r1.jar"
          python3 - <<'PYEOF'
          import zipfile
          out = zipfile.ZipFile('/tmp/android-merged.jar', 'w', zipfile.ZIP_DEFLATED)
          robo = zipfile.ZipFile('/tmp/android-all.jar')
          plat = zipfile.ZipFile('$ANDROID_HOME/platforms/android-23/android.jar')
          seen = set()
          for n in robo.namelist():
              if not n.endswith('/'):
                  seen.add(n)
                  out.writestr(n, robo.read(n))
          for n in plat.namelist():
              if not n.endswith('/') and n not in seen and n.startswith(('java/', 'javax/', 'org/xml/', 'org/w3c/', 'org/ietf/')):
                  out.writestr(n, plat.read(n))
          out.close()
          print('framework fundido ok')
          PYEOF
          cp /tmp/android-merged.jar "$ANDROID_HOME/platforms/android-23/android.jar"

      - name: Build (assembleDebug)
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-debug-apk
          path: app/build/outputs/apk/debug/*.apk
