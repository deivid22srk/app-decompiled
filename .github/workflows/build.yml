name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download tools (apktool 2.10.0 + uber-apk-signer 1.3.0)
        run: |
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -sSL -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Decode APK (resources + smali)
        run: java -jar apktool.jar d app.apk -o decoded -f

      - name: Rename package (com.android.vending -> com.deivid22srk.store)
        run: |
          chmod +x rename_package.sh
          ./rename_package.sh decoded com.android.vending com.deivid22srk.store

      - name: Dedup permissions/authorities (evita DUPLICATE_PERMISSION/CONFLICTING_PROVIDER)
        run: python3 fix_permissions.py decoded com.deivid22srk.store

      - name: Rebuild APK
        run: |
          mkdir -p dist
          java -jar apktool.jar b decoded --use-aapt1 -o dist/com.deivid22srk.store-unsigned.apk

      - name: Sign APK (debug key)
        run: java -jar uber-apk-signer.jar -a dist/com.deivid22srk.store-unsigned.apk --out dist/signed

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-rebuilt-apk
          path: dist/signed/*.apk
          if-no-files-found: error
